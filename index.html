<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Main navigation">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M7 12.5l3.2 3.2L17.5 8" /></svg>
          </div>
          <span>StudyFlow</span>
        </div>

        <nav class="nav-list">
          <button class="nav-item active" data-view="today">
            <span class="nav-icon"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg></span>
            <span>Today</span>
            <span class="count" id="todayCount">0</span>
          </button>
          <button class="nav-item" data-view="upcoming">
            <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M4 5h16M4 12h16M4 19h16"/><circle cx="7" cy="5" r="1"/><circle cx="7" cy="12" r="1"/><circle cx="7" cy="19" r="1"/></svg></span>
            <span>Upcoming</span>
            <span class="count" id="upcomingCount">0</span>
          </button>
          <button class="nav-item" data-view="calendar">
            <span class="nav-icon"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg></span>
            <span>Calendar</span>
          </button>
          <button class="nav-item" data-view="completed">
            <span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12l2.5 2.5L16.5 8"/></svg></span>
            <span>Completed</span>
          </button>
        </nav>

        <div class="sidebar-divider"></div>
        <div class="course-heading">
          <p class="sidebar-label">My courses</p>
          <button class="add-course-button" id="addCourseButton" aria-label="Add course">+</button>
        </div>
        <nav class="course-list" id="courseList"></nav>

        <button class="profile">
          <div class="avatar">NS</div>
          <div class="profile-text"><strong>Naitik</strong><span>naitik@college.edu</span></div>
          <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>
        </button>
      </aside>

      <main class="main">
        <header class="topbar">
          <button class="mobile-menu" id="mobileMenu" aria-label="Open navigation">
            <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          </button>
          <div class="date-line">
            <span id="currentDate">Monday, November 20</span>
            <div class="progress-ring" aria-label="Today's progress">
              <svg viewBox="0 0 36 36"><circle class="ring-bg" cx="18" cy="18" r="15.5"/><circle class="ring-progress" id="ringProgress" cx="18" cy="18" r="15.5"/></svg>
              <span id="progressText">0%</span>
            </div>
          </div>
          <label class="theme-picker" for="themeSelect">
            <span>Theme</span>
            <span class="theme-select">
              <select id="themeSelect" aria-label="Choose a theme">
                <option value="purple">Purple</option>
                <option value="dark">Dark</option>
                <option value="ocean">Ocean</option>
                <option value="forest">Forest</option>
              </select>
            </span>
          </label>
          <button class="add-button" id="addTaskButton"><span>+</span> Add assignment</button>
        </header>

        <div class="content">
          <div class="title-row">
            <div>
              <p class="eyebrow">Good morning, Naitik</p>
              <h1 id="pageTitle">Today</h1>
            </div>
            <div class="view-actions">
              <button class="icon-button" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M16 16l4 4"/></svg></button>
              <button class="icon-button" aria-label="More options"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
            </div>
          </div>

          <section class="task-section">
            <div class="section-heading">
              <h2 id="sectionTitle">Tasks for today</h2>
              <span id="taskSummary">0 tasks</span>
            </div>
            <div class="task-list" id="taskList"></div>
            <div class="calendar-view" id="calendarView" hidden></div>
          </section>
        </div>
      </main>
    </div>

    <dialog class="task-dialog" id="taskDialog">
      <form id="taskForm" method="dialog">
        <div class="dialog-header">
          <div>
            <p class="eyebrow">New assignment</p>
            <h2>Add an assignment</h2>
          </div>
          <button type="button" class="dialog-close" id="closeDialog" aria-label="Close">&times;</button>
        </div>
        <label>Assignment name
          <input id="taskName" name="name" required placeholder="e.g. Chapter 5 problem set" />
        </label>
        <div class="form-grid">
          <label>Course
            <select id="taskCourse" name="course">
              <option value="" disabled selected>Add a course first</option>
            </select>
          </label>
          <label>Due date
            <input id="taskDue" name="due" type="date" />
          </label>
        </div>
        <div class="form-grid">
          <label>Due time <span>(optional)</span>
            <input id="taskTime" name="time" type="time" />
          </label>
          <label>Duration
            <select id="taskDuration" name="duration">
              <option value="60">1 hour</option>
              <option value="30">30 minutes</option>
              <option value="90">1.5 hours</option>
              <option value="120">2 hours</option>
            </select>
          </label>
        </div>
        <label>Notes <span>(optional)</span>
          <textarea id="taskNotes" name="notes" rows="3" placeholder="Add details or a description"></textarea>
        </label>
        <button class="submit-button" type="submit">Create assignment</button>
      </form>
    </dialog>

    <dialog class="task-dialog" id="courseDialog">
      <form id="courseForm">
        <div class="dialog-header">
          <div>
            <p class="eyebrow">Course</p>
            <h2>Add a course</h2>
          </div>
          <button type="button" class="dialog-close" id="closeCourseDialog" aria-label="Close">&times;</button>
        </div>
        <label>Course name
          <input id="courseName" required placeholder="e.g. Biology 101" />
        </label>
        <button class="submit-button" type="submit">Add course</button>
      </form>
    </dialog>

    <script src="app.js"></script>
  </body>
</html>
